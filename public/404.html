<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var base = '/FCDS-Website';
        var path = location.pathname;
        if (path.indexOf(base) === 0) {
          path = path.slice(base.length) || '/';
        }
        if (path.charAt(0) !== '/') path = '/' + path;
        location.replace(base + '/#' + path + location.search);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
